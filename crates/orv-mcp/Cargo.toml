[package]
name = "orv-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
gpu-tests = []

[dependencies]
orv-core = { workspace = true, features = ["schema"] }
orv-render.workspace = true
orv-agents.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
base64.workspace = true
getrandom.workspace = true
subtle.workspace = true
zeroize.workspace = true
schemars.workspace = true
pollster.workspace = true
reqwest.workspace = true

[[bin]]
name = "openradview-mcp"
path = "src/main.rs"

[dev-dependencies]
tempfile = "=3.27.0"
dicom-object.workspace = true
dicom-core = "=0.10.0"
tokio = { workspace = true, features = ["process"] }
image.workspace = true
sha2.workspace = true

[lints]
workspace = true
