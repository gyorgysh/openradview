# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "orv-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
gpu-tests = []

[[test]]
name = "gpu_golden"
required-features = ["gpu-tests"]

[[test]]
name = "volume_gpu"
required-features = ["gpu-tests"]

[dependencies]
orv-core.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
image.workspace = true
serde.workspace = true
sha2.workspace = true
pollster.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["gles"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "=0.3.2", default-features = false, features = ["std", "MTLDevice"] }

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["dxgi"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
