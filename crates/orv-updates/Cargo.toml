# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "orv-updates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
release-validation = []

[[example]]
name = "verify_release_update"
required-features = ["release-validation"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
zip.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
semver = "=1.0.28"
tar = { version = "=0.4.46", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
tempfile = "=3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

[lints]
workspace = true
