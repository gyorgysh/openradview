# SPDX-License-Identifier: GPL-3.0-or-later
name: OpenGL capability diagnostics
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [linux]
        default: linux
permissions:
  contents: read
jobs:
  gl:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libxkbcommon-dev libwayland-dev libvulkan1 libegl1 mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri xvfb xauth
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: orv-native-Linux-ubuntu-22.04
          save-if: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-nextest@0.9.149
      - name: Mesa optical, atlas and projection paths
        run: |
          xvfb-run -a env WGPU_BACKEND=gl LIBGL_ALWAYS_SOFTWARE=1 cargo nextest run --locked -p orv-render --all-features --no-fail-fast -E 'test(homogeneous_optical_slab_matches_beer_lambert) or test(zero_flag_classifications_keep_the_original_two_group_gpu_fallback) or test(paged_zero_classification_keeps_every_dense_pixel) or test(accelerated_complete_2048_image)'
