# SPDX-License-Identifier: GPL-3.0-or-later
name: Manual Windows and Linux packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native packages to check
        type: choice
        options: [both, windows, linux]
        default: both
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/ci.yml
    with:
      platform: ${{ inputs.platform == 'both' && 'portable' || inputs.platform }}
