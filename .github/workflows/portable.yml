# SPDX-License-Identifier: GPL-3.0-or-later
name: Public update transport diagnostics
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [windows]
        default: windows
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      PYTHONUTF8: 1
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: orv-native-Windows
          save-if: false
      - run: cargo fetch --locked --target x86_64-pc-windows-msvc
      - name: Published signed roundtrip and unauthenticated live feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/published_updates.py --target x86_64-pc-windows-msvc
