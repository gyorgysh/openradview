# SPDX-License-Identifier: GPL-3.0-or-later
name: Native release checks
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native hosts to check (all is the release preflight)
        type: choice
        options: [all, macos, windows, linux, portable]
        default: all
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
permissions:
  contents: read
concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      hosts: ${{ steps.select.outputs.hosts }}
    steps:
      - name: Select pinned native hosts
        id: select
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          hosts = {
              'macos': ('macos-26', 'aarch64-apple-darwin'),
              'windows': ('windows-2025', 'x86_64-pc-windows-msvc'),
              'linux': ('ubuntu-22.04', 'x86_64-unknown-linux-gnu'),
          }
          selected = os.environ['PLATFORM']
          if selected not in (*hosts, 'all', 'portable'):
              raise SystemExit('Unknown native platform')
          names = list(hosts) if selected == 'all' else ['windows', 'linux'] if selected == 'portable' else [selected]
          matrix = [{'os': hosts[name][0], 'target': hosts[name][1],
                     'cargo_args': '' if name == 'macos' else '--target ' + hosts[name][1]}
                    for name in names]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('hosts=' + json.dumps(matrix) + '\n')
          PYTHON
  package:
    needs: matrix
    name: package (${{ matrix.os }}, ${{ matrix.target }})
    timeout-minutes: 75
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.hosts) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      PYTHONUTF8: 1
      RUSTFLAGS: ${{ matrix.os == 'windows-2025' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Linux build, graphics and installer dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config binutils dpkg-dev desktop-file-utils libxkbcommon-dev libxkbcommon-x11-0 libx11-6 libxcursor1 libxi6 libxrandr2 libxcb1 libdbus-1-3 libwayland-dev libvulkan1 libegl1 mesa-vulkan-drivers libegl-mesa0 libgl1-mesa-dri xvfb xauth xdg-desktop-portal xdg-desktop-portal-gtk
      - name: Pinned Rust toolchain
        run: rustup show
      - name: Restore checked native build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: orv-native-${{ runner.os }}-${{ matrix.os }}
          cache-workspace-crates: true
          # Successful main checks seed future releases. A tag's preflight also
          # saves its own cache for the protected signing job in the same run.
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Fetch exact dependencies
        run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Format and Clippy (default, shipping, all features)
        id: format_clippy
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets ${{ matrix.cargo_args }} -- -D warnings
          cargo clippy --locked --workspace --all-targets --features orv-app/mcp,orv-app/updates ${{ matrix.cargo_args }} -- -D warnings
          cargo clippy --locked --workspace --all-targets --all-features ${{ matrix.cargo_args }} -- -D warnings
      - name: Default native tests
        id: default_tests
        run: cargo nextest run --locked --workspace ${{ matrix.cargo_args }} --profile native-default
      - name: Shipping native tests
        id: shipping_tests
        run: cargo nextest run --locked --workspace --features orv-app/mcp,orv-app/updates ${{ matrix.cargo_args }} --profile native-shipping
      - name: Full native tests including GPU rendering
        id: full_tests
        run: cargo nextest run --locked --workspace --all-features ${{ matrix.cargo_args }} --profile native-full
      - name: Reject failed, retried, skipped or missing native coverage
        run: python scripts/ci/native_report.py --target ${{ matrix.target }} --tests-only
      - name: Linux GPU worker shutdown stress
        if: runner.os == 'Linux'
        run: |
          cargo nextest run --locked --workspace --target ${{ matrix.target }} --stress-count 10 -E 'test(gpu_interactive_oblique_keeps_full_detail_and_settles_to_canonical_cpu)'
          cargo nextest run --locked --workspace --all-features --target ${{ matrix.target }} --stress-count 10 -E 'test(background_upload_cancel_releases_source_without_waiting_on_ui) or test(authenticated_tools_are_scoped_and_revoke_closes_the_listener) or test(local_series_comparison_revokes_sharing_and_cannot_publish_or_apply_shared_views) or test(real_mcp_request_drives_desktop_then_reviewed_png_matches_the_preview) or test(gpu_interactive_oblique_keeps_full_detail_and_settles_to_canonical_cpu)'
      - name: Linux software OpenGL rendering and native idle smoke
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a env WGPU_BACKEND=gl LIBGL_ALWAYS_SOFTWARE=1 cargo nextest run --locked --target ${{ matrix.target }} -p orv-render --features gpu-tests --lib --test gpu_golden --test volume_gpu --no-fail-fast -E 'binary(gpu_golden) or test(snapshot::slab_gpu_snapshot) or test(limits::a_display_only_device) or test(homogeneous_optical_slab_matches_beer_lambert) or test(zero_flag_classifications_keep_the_original_two_group_gpu_fallback) or test(paged_zero_classification_keeps_every_dense_pixel) or test(accelerated_complete_2048_image)'
          cargo build --locked --target ${{ matrix.target }} -p orv-app --features qa
          xvfb-run -a env WGPU_BACKEND=gl LIBGL_ALWAYS_SOFTWARE=1 ORV_QA_NATIVE_SMOKE=1 python scripts/ci/native_gl.py target/${{ matrix.target }}/debug/openradview
      - name: Portable packaging helpers
        run: python -m unittest discover -s scripts/portable -p 'test_*.py'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: runner.os == 'macOS'
        with:
          node-version: '24'
      - name: Release policy, packaging and manifest signer tests
        if: runner.os == 'macOS'
        run: |
          python -m unittest discover -s scripts/macos -p 'test_*.py'
          python -m unittest discover -s scripts/ci -p 'test_*.py'
          node --test scripts/ci/sign-manifest.test.mjs
      - name: Default and full workspace builds
        run: |
          cargo build --locked --workspace ${{ matrix.cargo_args }}
          cargo build --locked --workspace --all-features ${{ matrix.cargo_args }}
      - name: Compile optimized macOS shipping binaries and updater verifier
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --release -p orv-app -p orv-mcp --bins --features orv-app/mcp,orv-app/updates
          cargo build --locked -p orv-updates --features release-validation --example verify_release_update
      - name: Native optimized application archive
        if: runner.os != 'macOS'
        run: python scripts/portable/bundle.py --target ${{ matrix.target }}
      - name: Pinned Windows installer compiler
        if: runner.os == 'Windows'
        run: python scripts/ci/inno.py
      - name: Windows installer
        if: runner.os == 'Windows'
        run: python scripts/portable/installers.py --target ${{ matrix.target }} --compiler "$ORV_INNO_COMPILER"
      - name: Debian installer
        if: runner.os == 'Linux'
        run: python scripts/portable/installers.py --target ${{ matrix.target }}
      - name: Native installation, version probes and removal
        id: installer_tests
        if: runner.os != 'macOS'
        run: python scripts/portable/smoke_installers.py --target ${{ matrix.target }}
      - name: Published native updater roundtrip and live feed
        if: runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/published_updates.py --target ${{ matrix.target }}
      - name: Record actual native acceptance scope
        if: runner.os != 'macOS'
        env:
          ORV_NATIVE_OUTCOMES: '{"format_clippy":"${{ steps.format_clippy.outcome }}","default_tests":"${{ steps.default_tests.outcome }}","shipping_tests":"${{ steps.shipping_tests.outcome }}","full_tests":"${{ steps.full_tests.outcome }}","installer_tests":"${{ steps.installer_tests.outcome }}"}'
        run: python scripts/ci/native_report.py --target ${{ matrix.target }}
      - name: Preserve native test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-tests-${{ matrix.target }}-${{ github.sha }}
          path: target/nextest/*/junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve native packages
        if: ${{ !cancelled() && runner.os != 'macOS' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.target }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
